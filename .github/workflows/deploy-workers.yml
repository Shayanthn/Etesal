name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-workers/**'
      - 'workflows/cloudflare-worker/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch: # امکان اجرای دستی پایپ‌لاین

jobs:
  deploy-sitemap:
    runs-on: ubuntu-latest
    name: Deploy Sitemap Worker
    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Sitemap Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cloudflare-workers'
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  deploy-validator:
    runs-on: ubuntu-latest
    name: Deploy Validator Worker
    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Validator Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'workflows/cloudflare-worker'
          secrets: |
            TELEGRAM_WEBHOOK_SECRET
            TELEGRAM_BOT_TOKEN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
