name: Build & Release Android APK (Etesal Hub)

on:
  push:
    tags:
      - 'v*' # Runs automatically on version tags, e.g. v6.0.4
    branches:
      - main
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android || (npx cap add android && npx cap sync android)

      - name: Build Android Release APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Sign Release APK (if keystore secret exists)
        uses: r0adkll/sign-android-release@v1
        if: success()
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_FILE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Sign with Built-in Fallback Key (Guarantees Installable APK)
        if: steps.sign_app.outcome != 'success' || steps.sign_app.conclusion != 'success'
        run: |
          echo "Applying fallback signature so APK installs without 'App not installed' error..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$UNSIGNED_APK" ]; then
            keytool -genkey -v -keystore ./temp-release.keystore -alias etesal -keyalg RSA -keysize 2048 -validity 10000 -storepass etesal123 -keypass etesal123 -dname "CN=Etesal, OU=Mobile, O=Etesal Hub, L=Tehran, S=Tehran, C=IR"
            $BUILD_TOOLS_DIR/apksigner sign --ks ./temp-release.keystore --ks-pass pass:etesal123 --key-pass pass:etesal123 --out android/app/build/outputs/apk/release/etesal-signed.apk "$UNSIGNED_APK"
            echo "Successfully signed release APK with fallback key."
          fi

      - name: Generate SHA-256 Checksum
        id: checksum
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*-signed.apk" -o -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" ./etesal-hub-release.apk
            sha256sum ./etesal-hub-release.apk > ./etesal-hub-release.apk.sha256
            echo "APK_GENERATED=true" >> $GITHUB_ENV
            echo "SHA256=$(cat ./etesal-hub-release.apk.sha256 | awk '{print $1}')" >> $GITHUB_ENV
          else
            echo "APK_GENERATED=false" >> $GITHUB_ENV
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        if: env.APK_GENERATED == 'true'
        with:
          name: etesal-hub-android-apk
          path: |
            ./etesal-hub-release.apk
            ./etesal-hub-release.apk.sha256
          retention-days: 30

      - name: Create Official GitHub Release (Tag push only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && env.APK_GENERATED == 'true'
        with:
          name: "Etesal Hub Official Release ${{ github.ref_name }}"
          body: |
            ### 🚀 اپلیکیشن رسمی سامانه اتصال (Etesal)
            - **نسخه:** `${{ github.ref_name }}`
            - **شناسه بسته:** `ir.aeherai.etesal`
            - **هش امنیتی SHA-256:** `${{ env.SHA256 }}`
            - **پشتیبانی در تلگرام:** [@NetWithoutBorders](https://t.me/NetWithoutBorders)
            - **کانال اطلاع‌رسانی:** [@vpnbuying](https://t.me/vpnbuying)
            
            *کامپایل شده امن و بدون هیچ‌گونه لاگ یا ترکینگ هویت.*
          files: |
            ./etesal-hub-release.apk
            ./etesal-hub-release.apk.sha256
          draft: false
          prerelease: false
