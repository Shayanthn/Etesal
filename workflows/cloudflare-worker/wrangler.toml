name = "etesal-validator"
main = "validator-worker.ts"
compatibility_date = "2026-08-27"
workers_dev = true

routes = [
  { pattern = "etesal.aetherai.ir/api/*", zone_name = "aetherai.ir" },
  { pattern = "etesal.aetherai.ir/validate", zone_name = "aetherai.ir" },
  { pattern = "etesal.aetherai.ir/telegram/webhook", zone_name = "aetherai.ir" }
]

[vars]
ALLOWED_ORIGIN = "https://etesal.aetherai.ir"

[observability]
enabled = true
